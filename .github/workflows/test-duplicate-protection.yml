name: Validar protecao de vistorias
on:
  pull_request:
    paths:
      - index.html
      - tests/duplicate-protection.test.cjs
      - .github/workflows/test-duplicate-protection.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/duplicate-protection.test.cjs
