name: Validar consulta de campo por unidade
on:
  push:
    branches: [feature/crm-whatsapp-recorrencia-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/postgres/package-lock.json
      - run: npm ci --prefix tests/postgres --ignore-scripts --no-audit --no-fund
      - name: Verificar autorização e projeção no PostgreSQL isolado
        run: |
          NODE_PATH=./tests/postgres/node_modules node tests/field-agenda-db.integration.cjs
          NODE_PATH=./tests/postgres/node_modules node tests/field-agenda-legacy-db.integration.cjs
          node tests/field-agenda-api.test.cjs
          node tests/field-report-api.test.cjs
          node tests/field-report-ui.test.cjs
          NODE_PATH=./tests/postgres/node_modules node tests/legacy-report-media-guard-db.integration.cjs
          NODE_PATH=./tests/postgres/node_modules node tests/scoped-report-db.integration.cjs
