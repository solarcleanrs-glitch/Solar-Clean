name: Validar CRM WhatsApp
on:
  pull_request:
    paths:
      - index.html
      - tests/crm-whatsapp.test.cjs
      - .github/workflows/test-crm-whatsapp.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/crm-whatsapp.test.cjs
