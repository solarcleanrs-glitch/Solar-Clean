<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste isolado de armazenamento — Solar Clean</title><body><h1>Teste de armazenamento por conta</h1><p>Somente dados sintéticos em bancos novos. Não lê nem modifica o banco operacional.</p><button id="run">Executar teste isolado</button><pre id="result" role="status">Aguardando execução.</pre><script src="../lib/scoped-vistoria-store.js"></script><script>
if(location.hostname!=='solar-clean-testes-crm.pages.dev'){document.getElementById('run').disabled=true;}else document.getElementById('run').onclick=async()=>{const btn=document.getElementById('run'),out=document.getElementById('result');btn.disabled=true;try{const project='https://zzphucuiqhzrilrddxnf.supabase.co',A={project,actor:crypto.randomUUID()},B={project,actor:crypto.randomUUID()};let current=A;const backend=SCScopedVistoriaStore.indexedDBBackend(indexedDB),a=SCScopedVistoriaStore.session({context:()=>current,backend}),source=[{id:1,cliente:'Teste sintético',syncStatus:'pending',photos:[{data:'data:image/png;base64,dGVzdGU='}]}];const assert=(v,msg)=>{if(!v)throw Error(msg);};const copy=await a.copyLegacy({sourceRecords:source,confirmedOwner:A});assert(copy.verified===1,'Cópia');assert(JSON.stringify(await a.list())===JSON.stringify(source),'Fotos e pendência');const again=await a.copyLegacy({sourceRecords:source,confirmedOwner:A});assert(again.copied===0,'Repetição');current=B;const b=SCScopedVistoriaStore.session({context:()=>current,backend});assert((await b.list()).length===0,'Conta B vazia');await b.add({id:1,cliente:'Outra conta sintética'});current=A;assert(JSON.stringify(await a.list())===JSON.stringify(source),'Conta A preservada');let rejected=false;try{await a.copyLegacy({sourceRecords:[{id:2},{id:1,cliente:'Conflito sintético'}],confirmedOwner:A});}catch{rejected=true;}assert(rejected,'Conflito rejeitado');assert((await a.list()).length===1,'Transação sem cópia parcial');out.textContent='PASSOU: IndexedDB real no navegador.\nCópia e releitura: conferidas.\nFoto e pendência: preservadas.\nRepetição: sem duplicar.\nContas A/B/A: separadas.\nConflito: rejeitado sem cópia parcial.\nBanco operacional: não acessado.';}catch(e){out.textContent='FALHOU: '+e.message;}finally{btn.disabled=false;}};
</script></body></html>
