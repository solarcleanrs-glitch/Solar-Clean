<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teste sintético de rascunhos entre abas</title>
<style>body{font:16px system-ui;max-width:850px;margin:32px auto;padding:0 20px;background:#f4f7fa;color:#183044}section{background:white;border:1px solid #ccd6df;padding:20px;margin:16px 0;border-radius:12px}button,a,select,input{font:inherit;padding:10px;margin:6px 0}button{cursor:pointer}label{display:block}pre{white-space:pre-wrap;font:14px system-ui}#result{font-weight:bold}#blocked{color:#9a3000}</style>
<h1>Rascunhos entre abas — teste sintético</h1><p>Usa cópias fictícias, armazenamento separado e os módulos de rascunhos do aplicativo. Não acessa autenticação, banco de clientes ou dados legados.</p>
<section><p id="testLabel"></p><p id="owner"></p><a id="secondTab" target="_blank" rel="noopener">Abrir a mesma simulação em outra aba</a><label>Conta fictícia<select id="actor"><option value="A">A</option><option value="B">B</option></select></label><button id="switch">Trocar conta no teste</button></section>
<section><label>Cliente fictício<input id="client" value="Cliente sintético A"></label><button id="begin">Abrir rascunho sintético</button><button id="preserve">Preservar cópia</button><label>Cópias desta conta<select id="copies"></select></label><button id="recover">Recuperar cópia</button><p id="blocked"></p></section>
<section><label><input id="pause" type="checkbox">Pausar próximo salvamento para testar concorrência</label><button id="save">Salvar registro sintético</button><button id="release">Liberar salvamento</button><button id="count">Conferir registros sintéticos</button><p id="result" role="status">Pronto para testar.</p><pre id="log"></pre></section>
<script src="../lib/account-draft-vault.js"></script><script src="../lib/account-draft-session.js"></script><script src="../lib/draft-save-lock.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),valid=/^[0-9a-f-]{36}$/i;
const testId=valid.test(location.hash.slice(1))?location.hash.slice(1):crypto.randomUUID();
location.hash=testId;
const prefix='SolarCleanSyntheticDraftTest:'+testId+':',contextKey=prefix+'context';
if(!localStorage.getItem(contextKey))localStorage.setItem(contextKey,JSON.stringify({A:crypto.randomUUID(),B:crypto.randomUUID(),selected:'A'}));
let shared=JSON.parse(localStorage.getItem(contextKey)),draftId=null,release=null;
const context=()=>({project:SCAccountDraftVault.PROJECT,actor:shared[shared.selected],generation:0});
const keys=()=>Object.keys(localStorage).filter(k=>k.startsWith(prefix+'vault:'));
const storage={get length(){return keys().length;},key:i=>keys()[i]?.slice((prefix+'vault:').length)??null,getItem:k=>localStorage.getItem(prefix+'vault:'+k),setItem:(k,v)=>localStorage.setItem(prefix+'vault:'+k,v)};
const log=message=>{$('log').textContent+=message+'\n';$('result').textContent=message;};
const clear=()=>{$('client').value='';draftId=null;};
const session=SCAccountDraftSession.create({storage,context,randomUUID:()=>crypto.randomUUID(),snapshot:()=>({cliente:$('client').value,photos:[{data:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}],signature:'ASSINATURA SINTÉTICA',draftCloudId:draftId}),clear,restore:p=>{$('client').value=p.cliente;draftId=p.draftCloudId;},quarantine:e=>{$('blocked').textContent='Cópia retida nesta aba: '+e.message;}});
function refresh(){
 $('owner').textContent='Conta fictícia atual: '+shared.selected;$('actor').value=shared.selected;
 $('copies').textContent='';const rows=session.list();rows.forEach((r,i)=>{const o=document.createElement('option');o.value=r.id;o.textContent='Cópia '+(i+1);$('copies').appendChild(o);});
 $('testLabel').textContent='Simulação: '+testId+' · '+rows.length+' cópia(s) da conta atual';
}
const db=new Promise((resolve,reject)=>{const req=indexedDB.open('SolarCleanSyntheticDraftRecords:'+testId,1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});
async function transaction(mode,operation){const database=await db;return new Promise((resolve,reject)=>{const tx=database.transaction('records',mode);let result;const req=operation(tx.objectStore('records'));req.onsuccess=()=>result=req.result;tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(tx.error||Error('transação interrompida'));tx.onerror=()=>{};});}
async function count(){const rows=await transaction('readonly',store=>store.getAll());log('Registros sintéticos salvos: '+rows.length);return rows;}
function action(fn){return async()=>{try{await fn();}catch(e){log('BLOQUEADO: '+e.message);}};}
$('begin').onclick=action(()=>{session.preserve();session.forgetOpen();draftId=crypto.randomUUID();session.begin();log('Rascunho aberto na conta '+shared.selected);});
$('preserve').onclick=action(()=>{session.preserve();refresh();log('Cópia conferida na conta '+shared.selected);});
$('recover').onclick=action(()=>{session.recover($('copies').value);log('Cópia recuperada sem criar registro.');});
$('switch').onclick=action(()=>{session.preserve();session.forgetOpen();clear();shared.selected=$('actor').value;localStorage.setItem(contextKey,JSON.stringify(shared));refresh();log('Conta trocada para '+shared.selected);});
$('release').onclick=()=>{release?.();release=null;};
$('save').onclick=action(async()=>{
 session.preserve();const owner=context().actor,id=draftId;
 const check=()=>{if(context().actor!==owner||draftId!==id)throw Error('A conta ou o formulário mudou.');};
 await SCDraftSaveLock.run({locks:navigator.locks,actor:owner,draftId:id,check,operation:async()=>{
  if(await transaction('readonly',store=>store.get(id)))throw Error('Esta cópia já originou um registro.');
  if($('pause').checked){log('Bloqueio adquirido; aguardando liberação.');await new Promise(resolve=>release=resolve);}
  check();await transaction('readwrite',store=>store.add({id,owner,cliente:$('client').value}));log('Registro sintético confirmado.');
 }});
 await count();
});
$('count').onclick=action(count);
window.addEventListener('storage',event=>{if(event.key===contextKey){shared=JSON.parse(event.newValue);try{const result=session.externalChange();refresh();log(result.changed?'Troca externa: cópia preservada na conta de origem e formulário limpo.':'Conta externa atualizada.');}catch(e){log('BLOQUEADO: '+e.message);}}});
$('secondTab').href=location.href;refresh();
</script></html>
